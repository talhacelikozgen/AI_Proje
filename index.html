<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dragon AI Hazırlanıyor...</title>
    <style>
        body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #0f172a; color: #e2e8f0; font-family: 'Segoe UI', sans-serif; }
        .loader-box { text-align: center; padding: 2rem; border: 1px solid rgba(148, 163, 184, 0.25); border-radius: 1.5rem; background: rgba(15, 23, 42, 0.85); box-shadow: 0 30px 60px rgba(15, 23, 42, 0.45); }
        .loader-title { font-size: 1.5rem; font-weight: 700; margin-bottom: 1rem; }
        .loader-subtitle { color: #94a3b8; margin-bottom: 1.5rem; }
        .spinner { width: 3rem; height: 3rem; border: 5px solid rgba(148, 163, 184, 0.25); border-top-color: #8b5cf6; border-radius: 50%; animation: spin 1s linear infinite; margin: 0 auto; }
        @keyframes spin { to { transform: rotate(360deg); } }
        .error { margin-top: 1rem; color: #f87171; }
    </style>
</head>
<body>
    <div class="loader-box">
        <div class="loader-title">Dragon AI sayfası hazırlanıyor...</div>
        <div class="loader-subtitle">Kodlar tarayıcıya gizleniyor, biraz bekleyin.</div>
        <div class="spinner"></div>
        <div id="errorMessage" class="error" style="display:none;"></div>
    </div>

    <script>
        async function loadProtectedPage() {
            try {
                const response = await fetch('/payload');
                if (!response.ok) throw new Error('Payload yüklenemedi');
                const data = await response.json();
                const decoded = atob(data.payload);
                document.open();
                document.write(decoded);
                document.close();
            } catch (error) {
                const message = document.getElementById('errorMessage');
                message.textContent = 'Sayfa yüklenirken bir hata oluştu. Lütfen sayfayı yenileyin.';
                message.style.display = 'block';
                console.error(error);
            }
        }

        loadProtectedPage();
    </script>
</body>
</html>
