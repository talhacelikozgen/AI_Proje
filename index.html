<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DRAGON AI v2 | Üretim Paneli</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background: #0f172a; color: white; font-family: 'Segoe UI', sans-serif; }
        .dragon-gradient { background: linear-gradient(90deg, #3b82f6, #8b5cf6, #ec4899); }
        .dragon-text-gradient { 
            background: linear-gradient(90deg, #3b82f6, #8b5cf6, #ec4899);
            background-clip: text;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .glass-panel { 
            background: rgba(30, 41, 59, 0.7); 
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        /* Özel kaydırma çubuğu */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: #0f172a; }
        ::-webkit-scrollbar-thumb { background: #334155; border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: #8b5cf6; }
    </style>
</head>
<body class="min-h-screen p-4 md:p-8">

    <div class="max-w-6xl mx-auto">
        <div class="flex justify-between items-center mb-10">
            <h1 class="text-4xl font-black uppercase tracking-tighter dragon-text-gradient">DRAGON AI v2</h1>
            <div class="text-slate-400 text-sm font-medium border-l border-slate-700 pl-4">
                SİSTEM DURUMU: <span class="text-emerald-400 animate-pulse">AKTİF (GPU)</span>
            </div>
        </div>

        <div class="grid grid-cols-1 lg:grid-cols-12 gap-8">
            
            <div class="lg:col-span-4 space-y-6">
                <div class="glass-panel p-6 rounded-3xl shadow-2xl">
                    <h2 class="text-xl font-bold mb-4 flex items-center gap-2">
                        <span class="w-2 h-6 dragon-gradient rounded-full"></span>
                        Yeni Emir
                    </h2>
                    <textarea id="prompt" rows="5" 
                        class="w-full bg-slate-900/50 border border-slate-700 rounded-2xl p-4 mb-4 outline-none focus:ring-2 focus:ring-purple-500 transition-all resize-none" 
                        placeholder="Hayalindeki görseli buraya yaz..."></textarea>
                    
                    <button onclick="generateImage()" id="genBtn" 
                        class="w-full dragon-gradient py-4 rounded-2xl font-bold text-lg hover:scale-[1.02] transition-all active:scale-95 shadow-lg shadow-purple-500/20">
                        GÖRSELİ ÜRET
                    </button>
                    
                    <div id="statusBox" class="mt-4 text-center text-sm text-slate-400 hidden">
                        <div class="flex items-center justify-center gap-2">
                            <svg class="animate-spin h-4 w-4 text-purple-500" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path></svg>
                            <span>İşlem devam ediyor...</span>
                        </div>
                    </div>
                </div>

                <div class="p-6 bg-blue-500/10 border border-blue-500/20 rounded-2xl">
                    <p class="text-xs text-blue-300 leading-relaxed">
                        <b>Bilgi:</b> Üretilen görseller otomatik olarak sistem geçmişine kaydedilir ve yerel sunucunuzda saklanır.
                    </p>
                </div>
            </div>

            <div class="lg:col-span-8 space-y-6">
                <div class="flex items-center justify-between">
                    <h2 class="text-2xl font-bold">Operasyon Geçmişi</h2>
                    <button onclick="loadHistory()" class="text-slate-400 hover:text-white text-sm flex items-center gap-2">
                        <span>Yenile</span>
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h5M20 20v-5h-5M15.24 15.24A8 8 0 114.88 7.05L4 9" /></svg>
                    </button>
                </div>

                <div id="historyGrid" class="grid grid-cols-1 md:grid-cols-2 gap-6 overflow-y-auto max-h-[70vh] pr-2">
                    </div>

                <div id="seeMoreContainer" class="text-center mt-6 hidden">
                    <button onclick="loadMore()" id="seeMoreBtn" class="dragon-gradient px-6 py-3 rounded-2xl font-bold hover:scale-[1.02] transition-all active:scale-95 shadow-lg shadow-purple-500/20">
                        DAHA FAZLA GÖRSEL GÖSTER
                    </button>
                </div>
            </div>

        </div>
    </div>

    <script>
        const API_BASE = "https://talhacell.taila77dbf.ts.net";
        const USERNAME = "Talha Celik";
        let allImages = [];
        let currentIndex = 0;
        const batchSize = 5;

        // Sayfa açıldığında geçmişi otomatik getir
        window.onload = loadHistory;

        async function loadHistory() {
            const grid = document.getElementById('historyGrid');
            
            try {
                const response = await fetch(`${API_BASE}/history/${encodeURIComponent(USERNAME)}`);
                allImages = await response.json();
                currentIndex = 0;
                grid.innerHTML = "";
                
                if(allImages.length === 0) {
                    grid.innerHTML = "<div class='col-span-full text-center p-20 text-slate-500'>Henüz bir kayıt bulunamadı.</div>";
                    document.getElementById('seeMoreContainer').classList.add('hidden');
                    return;
                }

                showNextBatch();
            } catch(e) { 
                console.error("Hata:", e);
                grid.innerHTML = "<div class='col-span-full text-center text-red-400'>Backend bağlantısı kurulamadı.</div>";
                document.getElementById('seeMoreContainer').classList.add('hidden');
            }
        }

        function showNextBatch() {
            const grid = document.getElementById('historyGrid');
            const seeMoreContainer = document.getElementById('seeMoreContainer');
            
            const nextBatch = allImages.slice(currentIndex, currentIndex + batchSize);
            
            nextBatch.forEach(imgName => {
                const card = document.createElement('div');
                card.className = "glass-panel p-3 rounded-2xl transition-transform hover:scale-[1.02]";
                
                // Saati ayıkla (dragon-HHMMSS.png formatından)
                const timePart = imgName.split('-')[1]?.split('.')[0] || "000000";
                const formattedTime = `${timePart.substring(0,2)}:${timePart.substring(2,4)}:${timePart.substring(4,6)}`;

                card.innerHTML = `
                    <div class="overflow-hidden rounded-xl mb-3 aspect-square bg-slate-900">
                        <img src="${API_BASE}/outputs/${encodeURIComponent(USERNAME)}/${imgName}" 
                             class="w-full h-full object-cover" 
                             alt="Dragon Output"
                             onclick="window.open(this.src, '_blank')">
                    </div>
                    <div class="flex justify-between items-center px-1">
                        <span class="text-[10px] text-slate-500 font-mono tracking-tighter">${imgName}</span>
                        <span class="text-xs font-bold text-purple-400">${formattedTime}</span>
                    </div>
                `;
                grid.appendChild(card);
            });
            
            currentIndex += batchSize;
            
            if(currentIndex < allImages.length) {
                seeMoreContainer.classList.remove('hidden');
            } else {
                seeMoreContainer.classList.add('hidden');
            }
        }

        function loadMore() {
            showNextBatch();
        }

        async function generateImage() {
            const promptInput = document.getElementById('prompt');
            const btn = document.getElementById('genBtn');
            const statusBox = document.getElementById('statusBox');

            if(!promptInput.value) return alert("Talha, ne üretmek istediğini yazmalısın!");

            btn.disabled = true;
            btn.classList.add('opacity-50');
            statusBox.classList.remove('hidden');

            try {
                const response = await fetch(`${API_BASE}/generate`, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ prompt: promptInput.value, user: USERNAME })
                });
                
                const data = await response.json();
                
                if(data.image_url) {
                    promptInput.value = "";
                    loadHistory(); // Listeyi güncelle
                }
            } catch (e) {
                alert("Sunucuya bağlanılamadı!");
            } finally {
                btn.disabled = false;
                btn.classList.remove('opacity-50');
                statusBox.classList.add('hidden');
            }
        }
    </script>
</body>
</html>
