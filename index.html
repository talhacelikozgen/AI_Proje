<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DRAGON AI v3 | Dinamik Panel</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background: #0f172a; color: white; font-family: 'Segoe UI', sans-serif; }
        .dragon-gradient { background: linear-gradient(90deg, #3b82f6, #8b5cf6, #ec4899); }
        .dragon-text-gradient { 
            background: linear-gradient(90deg, #3b82f6, #8b5cf6, #ec4899);
            background-clip: text;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .glass-panel { 
            background: rgba(30, 41, 59, 0.7); 
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: #0f172a; }
        ::-webkit-scrollbar-thumb { background: #334155; border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: #8b5cf6; }
    </style>
</head>
<body class="min-h-screen p-4 md:p-8">

    <div class="max-w-6xl mx-auto">
        <div class="flex justify-between items-center mb-10">
            <h1 class="text-4xl font-black uppercase tracking-tighter dragon-text-gradient">DRAGON AI v3</h1>
            <div class="flex items-center gap-4">
                <div id="connectionStatus" class="text-slate-400 text-sm font-medium border-l border-slate-700 pl-4">
                    SİSTEM: <span class="text-emerald-400">BAĞLI (LOCAL)</span>
                </div>
            </div>
        </div>

        <div class="grid grid-cols-1 lg:grid-cols-12 gap-8">
            <!-- Kontrol Paneli -->
            <div class="lg:col-span-4 space-y-6">
                <div class="glass-panel p-6 rounded-3xl shadow-2xl">
                    <h2 class="text-xl font-bold mb-4 flex items-center gap-2">
                        <span class="w-2 h-6 dragon-gradient rounded-full"></span>
                        Üretim Emri
                    </h2>
                    <textarea id="prompt" rows="5" 
                        class="w-full bg-slate-900/50 border border-slate-700 rounded-2xl p-4 mb-4 outline-none focus:ring-2 focus:ring-purple-500 transition-all resize-none text-white" 
                        placeholder="Hayalindeki ejderhayı veya tasarımı anlat..."></textarea>
                    
                    <button onclick="generateImage()" id="genBtn" 
                        class="w-full dragon-gradient py-4 rounded-2xl font-bold text-lg hover:scale-[1.02] transition-all active:scale-95 shadow-lg shadow-purple-500/20">
                        TASARLA VE KAYDET
                    </button>
                    
                    <div id="statusBox" class="mt-4 text-center text-sm text-slate-400 hidden">
                        <div class="flex items-center justify-center gap-2">
                            <svg class="animate-spin h-4 w-4 text-purple-500" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path></svg>
                            <span>GPU Çalışıyor... (VRAM Temizleniyor)</span>
                        </div>
                    </div>
                </div>

                <div class="p-6 bg-purple-500/10 border border-purple-500/20 rounded-2xl">
                    <p class="text-xs text-purple-300 leading-relaxed">
                        <b>Dinamik Senkronizasyon:</b> Görseller doğrudan <code>E:\Dragon_AI_Depo</code> yoluna kaydedilir ve GitHub güncellemesine gerek kalmadan anında burada listelenir.
                    </p>
                </div>
            </div>

            <!-- Dinamik Geçmiş Grid -->
            <div class="lg:col-span-8 space-y-6">
                <div class="flex items-center justify-between">
                    <h2 class="text-2xl font-bold">Dragon Depo (Canlı)</h2>
                    <button onclick="loadHistory()" class="text-slate-400 hover:text-white text-sm flex items-center gap-2 bg-slate-800 px-4 py-2 rounded-xl transition-all">
                        <span>Verileri Yenile</span>
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h5M20 20v-5h-5M15.24 15.24A8 8 0 114.88 7.05L4 9" /></svg>
                    </button>
                </div>

                <div id="historyGrid" class="grid grid-cols-1 md:grid-cols-2 gap-6 overflow-y-auto max-h-[75vh] pr-2">
                    <!-- Dinamik içerik buraya gelecek -->
                </div>
            </div>
        </div>
    </div>

    <script>
        // Senin Tailscale ve API Ayarların
        const API_BASE = "https://talhacell.taila77dbf.ts.net"; // Artık tail adresi yerine kendi domainini kullanıyorsun
        const USERNAME = "Talha Celik";
        let promptsCache = null;

        // Sayfa açıldığında verileri çek
        window.onload = loadHistory;

        async function loadHistory() {
            const grid = document.getElementById('historyGrid');
            const statusText = document.querySelector('#connectionStatus span');
            
            try {
                // 1. Önce prompt.json'u canlı çek (Cache temizleyerek)
                const pResponse = await fetch(`${API_BASE}/outputs/Talha%20Celik/prompt.json?t=${Date.now()}`);
                promptsCache = await pResponse.json();

                // 2. Klasördeki güncel dosya listesini çek
                const response = await fetch(`${API_BASE}/history/${encodeURIComponent(USERNAME)}`);
                const images = await response.json();
                
                grid.innerHTML = "";
                statusText.className = "text-emerald-400";
                statusText.innerText = "BAĞLI (LOCAL)";

                if(images.length === 0) {
                    grid.innerHTML = "<div class='col-span-full text-center p-20 text-slate-500 italic'>Depoda henüz ejderha yok...</div>";
                    return;
                }

                // Görselleri listele
                images.forEach(imgName => {
                    const promptText = promptsCache[imgName] || "Prompt bilgisi yerel dosyada bulunamadı.";
                    const card = document.createElement('div');
                    card.className = "glass-panel p-3 rounded-2xl transition-all hover:border-purple-500/50 group";
                    
                    // Zaman bilgisini dosya isminden çek
                    const parts = imgName.replace('dragon-', '').replace('.png', '').split('-');
                    const timeStr = parts[3] ? `${parts[3].substring(0,2)}:${parts[3].substring(2,4)}` : "00:00";

                    card.innerHTML = `
                        <div class="overflow-hidden rounded-xl mb-3 aspect-square bg-slate-900 relative">
                            <img src="${API_BASE}/outputs/Talha%20Celik/${imgName}" 
                                 class="w-full h-full object-cover cursor-zoom-in group-hover:scale-110 transition-transform duration-500" 
                                 onclick="window.open(this.src, '_blank')">
                            <div class="absolute bottom-2 right-2 bg-black/60 backdrop-blur-md px-2 py-1 rounded text-[10px] font-bold text-purple-400">
                                ${timeStr}
                            </div>
                        </div>
                        <div class="px-1">
                            <p class="text-xs text-slate-300 line-clamp-2 italic font-light cursor-pointer" onclick="togglePrompt(this)" title="Tam metin için tıkla">"${promptText}"</p>
                        </div>
                    `;
                    grid.appendChild(card);
                });

            } catch(e) {
                console.error("Bağlantı hatası:", e);
                statusText.className = "text-red-400";
                statusText.innerText = "BAĞLANTI KOPUK";
                grid.innerHTML = "<div class='col-span-full text-center text-red-400 p-10'>Yerel sunucu (main.py) kapalı veya Tailscale tüneli aktif değil.</div>";
            }
        }

        async function generateImage() {
            const promptInput = document.getElementById('prompt');
            const btn = document.getElementById('genBtn');
            const statusBox = document.getElementById('statusBox');

            if(!promptInput.value) return alert("Talha, üretim için bir tanım girmelisin.");

            // Arayüzü kilitle
            btn.disabled = true;
            btn.innerText = "İŞLENİYOR...";
            statusBox.classList.remove('hidden');

            try {
                const response = await fetch(`${API_BASE}/generate`, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ prompt: promptInput.value, user: USERNAME })
                });
                
                if(response.ok) {
                    promptInput.value = "";
                    // Üretim bittikten 1 saniye sonra listeyi yenile
                    setTimeout(loadHistory, 1000);
                } else {
                    alert("VRAM veya Sunucu Hatası!");
                }
            } catch (e) {
                alert("Sunucuya ulaşılamadı. main.py çalışıyor mu?");
            } finally {
                btn.disabled = false;
                btn.innerText = "TASARLA VE KAYDET";
                statusBox.classList.add('hidden');
            }
        }

        function togglePrompt(element) {
            element.classList.toggle('line-clamp-2');
            element.classList.toggle('line-clamp-none');
        }
    </script>
</body>
</html>
