<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dragon AI Portal</title>
    <style>
        :root {
            --bg: #0f172a;
            --panel: rgba(15, 23, 42, 0.92);
            --panel-strong: rgba(30, 41, 59, 0.95);
            --border: rgba(148, 163, 184, 0.18);
            --text: #e2e8f0;
            --muted: #94a3b8;
            --accent: #8b5cf6;
            --accent-soft: #c4b5fd;
            --danger: #fb7185;
            --success: #22c55e;
        }
        * { box-sizing: border-box; }
        body { margin: 0; min-height: 100vh; font-family: 'Segoe UI', sans-serif; background: radial-gradient(circle at top, rgba(139,92,246,.18), transparent 28%), linear-gradient(180deg, #020617 0%, #0a1226 100%); color: var(--text); }
        body, button, input { font: inherit; }
        .page-shell { max-width: 1600px; margin: 0 auto; padding: 16px; }
        .topbar { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 16px; margin-bottom: 14px; }
        .brand-tabs { display: flex; gap: 8px; flex-wrap: wrap; }
        .brand-tabs button, .subtabs button, .auth-actions button { border: 1px solid transparent; border-radius: 18px; padding: 12px 18px; cursor: pointer; transition: all .22s ease; background: rgba(255,255,255,.05); color: var(--text); }
        .brand-tabs button.active, .subtabs button.active { background: rgba(139,92,246,.95); border-color: rgba(139,92,246,0.45); color: white; }
        .brand-tabs button:hover, .subtabs button:hover, .auth-actions button:hover { transform: translateY(-1px); }
        .user-panel { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
        .user-badge { padding: 8px 14px; border-radius: 999px; background: rgba(148,163,184,.12); color: var(--muted); }
        .btn-outline { border-color: rgba(148,163,184,.25); }
        .subtabs { display: flex; gap: 10px; margin-bottom: 16px; }
        .frame-wrapper { position: relative; min-height: calc(100vh - 200px); border-radius: 26px; overflow: hidden; border: 1px solid rgba(255,255,255,.08); background: var(--panel); box-shadow: 0 25px 80px rgba(15,23,42,.35); }
        .content-frame { width: 100%; height: 100%; min-height: 820px; border: none; background: transparent; }
        .info-note { color: var(--muted); margin-bottom: 8px; }

        .overlay { position: fixed; inset: 0; background: rgba(2,7,26,.82); backdrop-filter: blur(10px); display: flex; align-items: center; justify-content: center; padding: 24px; z-index: 20; }
        .hidden { display: none !important; }
        .overlay.hidden { display: none; }
        .overlay-card { width: min(520px,100%); background: rgba(15,23,42,.96); border: 1px solid rgba(148,163,184,.14); border-radius: 24px; padding: 32px; box-shadow: 0 30px 80px rgba(0,0,0,.45); }
        .overlay-card h2 { margin: 0 0 16px; font-size: 1.35rem; color: white; }
        .overlay-card p { margin: 0 0 24px; color: var(--muted); line-height: 1.6; }
        .overlay-card input { width: 100%; padding: 14px 16px; border-radius: 14px; border: 1px solid rgba(148,163,184,.2); background: rgba(15,23,42,.95); color: white; margin-bottom: 18px; }
        .auth-actions { display: flex; gap: 10px; flex-wrap: wrap; }
        .overlay-close { position: absolute; top: 18px; right: 18px; width: 34px; height: 34px; border: none; border-radius: 50%; background: rgba(255,255,255,.08); color: white; cursor: pointer; }
        .alert { margin-top: 12px; color: var(--danger); font-size: .95rem; }

        @media (max-width: 768px) {
            .topbar { flex-direction: column; align-items: stretch; }
            .brand-tabs, .user-panel, .subtabs { justify-content: center; }
            .frame-wrapper { min-height: 720px; }
        }
    </style>
</head>
<body>
    <div class="page-shell">
        <header class="topbar">
            <div class="brand-tabs">
                <button id="tabDinimiz" class="active" onclick="switchBrand('dinim')">Dinimiz İslam</button>
                <button id="tabDragon" onclick="switchBrand('dragon')">Dragon AI</button>
            </div>
            <div class="user-panel">
                <span class="user-badge" id="userLabel">Giriş yapılmadı</span>
                <button class="btn-outline" onclick="showAuth()" id="loginBtn">Giriş Yap / Kaydol</button>
                <button class="btn-outline hidden" onclick="logout()" id="logoutBtn">Çıkış Yap</button>
            </div>
        </header>

        <div id="subNav" class="subtabs">
            <button class="active" data-view="dinim" onclick="switchSub('dinim')">Dinimiz İslam</button>
            <button data-view="kaza" onclick="switchSub('kaza')">Kaza Namazı Takip</button>
        </div>

        <div class="info-note" id="infoNote">Dinimiz İslam sayfası ana içeriktir. Kaza Takip için giriş gerekli.</div>
        <div class="frame-wrapper">
            <iframe id="contentFrame" class="content-frame" src="dinim.html"></iframe>
        </div>
    </div>

    <div class="overlay hidden" id="authOverlay">
        <div class="overlay-card">
            <button class="overlay-close" onclick="hideAuth()">✕</button>
            <h2>Giriş Yap veya Kaydol</h2>
            <p>Dragon AI geçmişinize ve Kaza Namazı Takip verilerinize erişmek için bir kullanıcı adı seçin.</p>
            <input type="text" id="authUserInput" placeholder="Kullanıcı adınız" autocomplete="username" />
            <div class="auth-actions">
                <button onclick="login()">Giriş Yap</button>
                <button onclick="registerUser()">Kaydol</button>
            </div>
            <p class="alert" id="authMessage"></p>
        </div>
    </div>

    <script>
        const STORAGE_KEY = 'dragon_portal_user';
        const frame = document.getElementById('contentFrame');
        const userLabel = document.getElementById('userLabel');
        const loginBtn = document.getElementById('loginBtn');
        const logoutBtn = document.getElementById('logoutBtn');
        const authOverlay = document.getElementById('authOverlay');
        const authMessage = document.getElementById('authMessage');
        const authUserInput = document.getElementById('authUserInput');
        const subNav = document.getElementById('subNav');
        let activeBrand = 'dinim';
        let activeSub = 'dinim';
        let currentUser = localStorage.getItem(STORAGE_KEY) || '';

        function updateUserState() {
            if (currentUser) {
                userLabel.innerText = `Girişli: ${currentUser}`;
                loginBtn.classList.add('hidden');
                logoutBtn.classList.remove('hidden');
            } else {
                userLabel.innerText = 'Giriş yapılmadı';
                loginBtn.classList.remove('hidden');
                logoutBtn.classList.add('hidden');
            }
        }

        function switchBrand(brand) {
            activeBrand = brand;
            document.getElementById('tabDinimiz').classList.toggle('active', brand === 'dinim');
            document.getElementById('tabDragon').classList.toggle('active', brand === 'dragon');
            subNav.style.display = brand === 'dinim' ? 'flex' : 'none';
            activeSub = 'dinim';
            document.querySelectorAll('.subtabs button').forEach(btn => btn.classList.toggle('active', btn.dataset.view === 'dinim'));
            renderFrame();
        }

        function switchSub(view) {
            activeSub = view;
            document.querySelectorAll('.subtabs button').forEach(btn => {
                btn.classList.toggle('active', btn.dataset.view === view);
            });
            renderFrame();
        }

        function renderFrame() {
            if (activeBrand === 'dragon') {
                if (!currentUser) {
                    showAuth('Dragon AI sayfasına erişmek için giriş yapmalısınız.');
                    return;
                }
                frame.src = `index.html?user=${encodeURIComponent(currentUser)}`;
                document.getElementById('infoNote').innerText = 'Dragon AI: Üretim geçmişine bağlanmak için kullanıcı adı ile giriş yapıldı.';
                return;
            }

            if (activeSub === 'dinim') {
                frame.src = 'dinim.html';
                document.getElementById('infoNote').innerText = 'Dinimiz İslam ana içeriği. Kaza Takip için alt sekmeye geçin.';
                return;
            }

            if (activeSub === 'kaza') {
                if (!currentUser) {
                    showAuth('Kaza Namazı Takip için giriş yapmanız gerekiyor.');
                    return;
                }
                frame.src = `kazatakip.html?user=${encodeURIComponent(currentUser)}`;
                document.getElementById('infoNote').innerText = 'Kaza Takip modülü yüklendi. Kaydınız kullanıcı adı ile eşlenir.';
            }
        }

        function showAuth(message = '') {
            authMessage.innerText = message;
            authUserInput.value = currentUser || '';
            authOverlay.classList.remove('hidden');
        }

        function hideAuth() {
            authMessage.innerText = '';
            authOverlay.classList.add('hidden');
        }

        function login() {
            const username = authUserInput.value.trim();
            if (!username) {
                authMessage.innerText = 'Lütfen geçerli bir kullanıcı adı girin.';
                return;
            }
            currentUser = username;
            localStorage.setItem(STORAGE_KEY, currentUser);
            updateUserState();
            hideAuth();
            renderFrame();
        }

        function registerUser() {
            const username = authUserInput.value.trim();
            if (!username) {
                authMessage.innerText = 'Lütfen kullanıcı adı girin.';
                return;
            }
            currentUser = username;
            localStorage.setItem(STORAGE_KEY, currentUser);
            updateUserState();
            hideAuth();
            renderFrame();
        }

        function logout() {
            currentUser = '';
            localStorage.removeItem(STORAGE_KEY);
            updateUserState();
            if (activeBrand === 'dragon' || activeSub === 'kaza') {
                activeBrand = 'dinim';
                switchBrand('dinim');
            } else {
                renderFrame();
            }
        }

        document.addEventListener('DOMContentLoaded', () => {
            updateUserState();
            switchBrand('dinim');
        });
    </script>
</body>
</html>
